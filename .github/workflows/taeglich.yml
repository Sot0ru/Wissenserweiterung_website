# Jeden Morgen neue Artikel schreiben lassen und die Website veröffentlichen.
#
# - Zeitplan: Start täglich 3:17 Uhr (Winterzeit) / 4:17 Uhr (Sommerzeit). Mit gemma4:e4b und
#   sechs Themen dauert ein Lauf etwa 45 bis 60 Minuten; die Artikel sind also gegen 4–5 Uhr online.
#   GitHub startet geplante Läufe manchmal etwas später.
# - Von Hand starten: Reiter „Actions“ → „Täglich neue Artikel“ → „Run workflow“.
# - Bei jedem Push auf main wird die Website ebenfalls neu veröffentlicht (ohne neue Artikel).
#
# Die Artikel schreibt ein freies Open-Source-Modell (Ollama + gemma4:e4b) direkt auf dem
# GitHub-Rechner. Für öffentliche Repositories kostet das nichts.

name: Täglich neue Artikel

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      per_category:
        description: "Neue Artikel pro Thema"
        default: "2"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taeglich
  cancel-in-progress: false

env:
  OLLAMA_MODEL: gemma4:e4b

jobs:
  generate:
    name: Artikel schreiben
    if: github.event_name != 'push'
    # Feste Version statt ubuntu-latest: Der Wechsel auf Ubuntu 26 (Okt. 2026) brach die Ollama-Installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 330 # GitHub erlaubt höchstens 360; fertige Artikel werden auch bei Abbruch gespeichert
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ollama installieren und Modell laden
        run: |
          # Jeder Teil wird bis zu dreimal versucht; kurze Aussetzer beim Download sollen den Lauf nicht kosten.
          retry() { for n in 1 2 3; do "$@" && return 0; echo "::warning::Versuch $n fehlgeschlagen: $*"; sleep 20; done; return 1; }

          echo "::group::Ollama installieren"
          retry sh -c 'curl -fsSL https://ollama.com/install.sh | sh'
          echo "::endgroup::"

          # Läuft Ollama nicht als Dienst (z. B. ohne systemd), selbst starten.
          if ! curl -sf http://127.0.0.1:11434/api/version; then
            echo "Ollama-Dienst läuft nicht – starte ollama serve"
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/version || { echo "::error::Ollama startet nicht"; cat "$RUNNER_TEMP/ollama.log" 2>/dev/null; exit 1; }

          echo "::group::Modell $OLLAMA_MODEL laden"
          retry ollama pull "$OLLAMA_MODEL" || { echo "::error::Modell $OLLAMA_MODEL konnte nicht geladen werden"; exit 1; }
          echo "::endgroup::"

      - name: Artikel generieren
        run: npm run generate -- --per-category "${{ github.event.inputs.per_category || '2' }}"

      - name: Neue Artikel speichern
        if: always()
        run: |
          npm run index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data generator/seen.json
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel."
            exit 0
          fi
          git commit -m "Neue Artikel vom $(date +%d.%m.%Y)"
          git pull --rebase
          git push

  deploy:
    name: Website veröffentlichen
    needs: generate
    # Auch nach Abbruch oder Zeitüberschreitung veröffentlichen, damit gespeicherte Artikel online gehen.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
